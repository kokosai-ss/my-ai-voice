<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Generator Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #ffffff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0369a1; }
        #speedSlider { margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ AI Voice Generator</h2>
    
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="API Key ထည့်ပါ...">

    <label>အသံအမျိုးအစား (၈ မျိုး)</label>
    <select id="voiceSelect">
        <option value="Puck">Puck (Male)</option>
        <option value="Charon">Charon (Male - Deep)</option>
        <option value="Kore">Kore (Female - Smooth)</option>
        <option value="Fenrir">Fenrir (Male - Energetic)</option>
        <option value="Aoede">Aoede (Female - Bright)</option>
        <option value="Gemini-Voice-1">Gemini-1 (Voice Tone 1)</option>
        <option value="Gemini-Voice-2">Gemini-2 (Voice Tone 2)</option>
        <option value="Ares">Ares (Male - Strong)</option>
    </select>

    <label>အသံ အမြန်နှုန်း (Speed: 1x သည် ပုံမှန်)</label>
    <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" oninput="updateSpeed()">
    <span id="speedValue" style="font-size:12px;">1x</span>

    <label>စာသား ရိုက်ထည့်ပါ</label>
    <textarea id="textInput" rows="4" placeholder="စာသားရိုက်ပါ..."></textarea>

    <button id="submitBtn" onclick="generateSpeech()">အသံထုတ်မည်</button>

    <audio id="audioPlayer" controls style="display:none; width:100%; margin-top:15px;"></audio>
</div>

<script>
function updateSpeed() {
    const slider = document.getElementById('speedSlider');
    const audio = document.getElementById('audioPlayer');
    document.getElementById('speedValue').innerText = slider.value + 'x';
    audio.playbackRate = slider.value;
}

async function generateSpeech() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('textInput').value.trim();
    const voice = document.getElementById('voiceSelect').value;
    const audioPlayer = document.getElementById('audioPlayer');
    const submitBtn = document.getElementById('submitBtn');

    if (!apiKey || !text) { alert("API Key နဲ့ စာသားဖြည့်ပါ!"); return; }

    submitBtn.innerText = "Generating...";
    submitBtn.disabled = true;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                }
            })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].inlineData) {
            const base64Audio = data.candidates[0].content.parts[0].inlineData.data;
            audioPlayer.src = `data:audio/mp3;base64,${base64Audio}`;
            audioPlayer.style.display = "block";
            audioPlayer.playbackRate = document.getElementById('speedSlider').value;
            audioPlayer.play();
        } else {
            alert("Error: " + (data.error ? data.error.message : "အသံဖိုင်မရပါ"));
        }
    } catch (err) { alert("Error: " + err.message); }
    finally { submitBtn.innerText = "အသံထုတ်မည်"; submitBtn.disabled = false; }
}
</script>

</body>
</html>
