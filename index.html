<script>
let API_KEYS = [];
let voiceList = [];
let audioContext = null;

// Page Load
window.addEventListener("load", () => {
    // API Keys restore
    const savedKeys = localStorage.getItem("gemini_api_keys");
    if(savedKeys){
        document.getElementById("apiKeys").value = savedKeys;
        parseApiKeys();
    }
});

// Save Keys
function saveApiKeys(){
    const raw = document.getElementById("apiKeys").value;
    localStorage.setItem("gemini_api_keys", raw);
    parseApiKeys();
    alert("API Keys များကို သိမ်းဆည်းပြီးပါပြီ။");
}

function parseApiKeys(){
    const raw = document.getElementById("apiKeys").value;
    API_KEYS = raw.split("\n").map(k => k.trim()).filter(k => k.length > 0);
    const status = document.getElementById("keyStatus");
    if(API_KEYS.length > 0){
        status.innerText = `🔑 Key စုစုပေါင်း: ${API_KEYS.length} ခု အဆင်သင့်ရှိပါသည်။`;
        status.className = "status-msg success";
    } else {
        status.innerText = "⚠️ API Key ထည့်သွင်းထားခြင်း မရှိပါ။";
        status.className = "status-msg error";
    }
}

function getRandomKey(){
    if(API_KEYS.length === 0) return null;
    const randomIndex = Math.floor(Math.random() * API_KEYS.length);
    return API_KEYS[randomIndex];
}

// Password Check
function checkPassword(){
    const input = document.getElementById("passInput").value.trim();
    const errorMsg = document.getElementById("passError");
    if(input === "1911999"){
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        fetchVoices();
    } else {
        errorMsg.style.display = "block";
    }
}

// Fetch Voices
async function fetchVoices(){
    const apiKey = getRandomKey();
    if(!apiKey){
        alert("ကျေးဇူးပြု၍ API Key အရင်ထည့်ပါ။");
        return;
    }

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        
        // Gemini TTS Supported Voices
        voiceList = [
            { name: "Puck", gender: "Male" },
            { name: "Charon", gender: "Male" },
            { name: "Kore", gender: "Female" },
            { name: "Fenrir", gender: "Male" },
            { name: "Aoede", gender: "Female" }
        ];

        populateVoiceDropdowns();
    } catch (e) {
        console.error("Voice Fetch Error:", e);
    }
}

function populateVoiceDropdowns(){
    const singleSelect = document.getElementById("singleVoiceSelect");
    if(singleSelect) {
        singleSelect.innerHTML = "";
        voiceList.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.name;
            opt.innerText = `${v.name} (${v.gender})`;
            singleSelect.appendChild(opt);
        });
    }

    // Dynamic Speaker Voice Dropdowns Update (For Multi-Voice)
    document.querySelectorAll(".speaker-voice-select").forEach(select => {
        const currentVal = select.value;
        select.innerHTML = "";
        voiceList.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.name;
            opt.innerText = `${v.name} (${v.gender})`;
            if(v.name === currentVal) opt.selected = true;
            select.appendChild(opt);
        });
    });
}

// Tab Switching
function switchTab(tabName){
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if(tabName === 'single'){
        document.getElementById('tabSingle').classList.add('active');
        document.getElementById('singleVoiceSection').classList.add('active');
    } else {
        document.getElementById('tabMulti').classList.add('active');
        document.getElementById('multiVoiceSection').classList.add('active');
    }
}

// Dropdown UI Helpers
function toggleDropdown() {
    const opts = document.getElementById('dropdownOptions');
    if(opts) opts.classList.toggle('hidden');
}

function selectOption(val, text) {
    const styleSel = document.getElementById('styleSelect');
    const styleText = document.getElementById('selectedStyleText');
    const opts = document.getElementById('dropdownOptions');
    
    if(styleSel) styleSel.value = val;
    if(styleText) styleText.innerText = text;
    if(opts) opts.classList.add('hidden');
}

function showSingleGenerateMessage(msg, type){
    const el = document.getElementById("singleGenerateMessage");
    if(el) {
        el.innerText = msg;
        el.className = `status-msg ${type}`;
    }
}

function showMultiGenerateMessage(msg, type){
    const el = document.getElementById("multiGenerateMessage");
    if(el) {
        el.innerText = msg;
        el.className = `status-msg ${type}`;
    }
}

// SINGLE VOICE GENERATION
async function generateSingleVoice(){
    const text = document.getElementById("singleText").value.trim();
    const voice = document.getElementById("singleVoiceSelect").value;
    const style = document.getElementById("styleSelect").value;
    const btn = document.getElementById("btnSingleGenerate");

    if(!text){
        showSingleGenerateMessage("⚠️ စာသားရိုက်ထည့်ပါ။", "error");
        return;
    }

    if(API_KEYS.length === 0){
        showSingleGenerateMessage("⚠️ API Key ထည့်သွင်းထားခြင်း မရှိပါ။", "error");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = "⏳ Generating...";
    showSingleGenerateMessage("ဖန်တီးနေပါသည်။ ခဏစောင့်ပါ...", "info");

    let success = false;
    let lastError = "";

    // Tone / Style Injection Setup
    let styledPrompt = text;
    if(style && style !== "normal"){
        styledPrompt = `[Tone/Style: Read this in a ${style} manner]\n${text}`;
    }

    for(let i = 0; i < API_KEYS.length; i++){
        const apiKey = API_KEYS[i];
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: styledPrompt }]
                    }],
                    generationConfig: {
                        responseMimeType: "audio/wav",
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: voice }
                            }
                        }
                    }
                })
            });

            const data = await response.json();
            if(data.error) throw new Error(data.error.message);

            const candidate = data.candidates?.[0];
            const part = candidate?.content?.parts?.[0];
            
            if(part && part.inlineData){
                const audioBytes = base64ToUint8Array(part.inlineData.data);
                const audioBlob = new Blob([audioBytes], { type: "audio/wav" });
                handleAudioGenerated(audioBlob);
                
                showSingleGenerateMessage("✅ အသံဖန်တီးပြီးပါပြီ။", "success");
                success = true;
                break;
            } else {
                throw new Error("Audio data မရရှိပါ။");
            }
        } catch(error) {
            lastError = error.message || "Unknown Error";
        }
    }

    if(!success){
        showSingleGenerateMessage("❌ Generate မအောင်မြင်ပါ။\nအကြောင်းရင်း: " + lastError, "error");
    }

    btn.disabled = false;
    btn.innerHTML = "🔊 Generate Single-Voice Audio";
}

// MULTI-VOICE GENERATION
async function generateMultiVoice(){
    const scriptText = document.getElementById("multiScriptText").value.trim();
    const btn = document.getElementById("btnMultiGenerate");

    if(!scriptText){
        showMultiGenerateMessage("⚠️ Script စာမူရိုက်ထည့်ပါ။", "error");
        return;
    }

    if(API_KEYS.length === 0){
        showMultiGenerateMessage("⚠️ API Key ထည့်သွင်းထားခြင်း မရှိပါ။", "error");
        return;
    }

    // Collect Dynamic Speaker Settings
    const speakerMap = {};
    document.querySelectorAll(".speaker-config-row").forEach(row => {
        const nameInput = row.querySelector(".speaker-name-input");
        const voiceSelect = row.querySelector(".speaker-voice-select");
        const styleSelect = row.querySelector(".speaker-style-select");

        if(nameInput && voiceSelect){
            const name = nameInput.value.trim().toLowerCase();
            if(name){
                speakerMap[name] = {
                    voice: voiceSelect.value,
                    style: styleSelect ? styleSelect.value : "normal"
                };
            }
        }
    });

    btn.disabled = true;
    btn.innerHTML = "⏳ Generating Multi-Voice...";
    showMultiGenerateMessage("Multi-Voice ဖန်တီးနေပါသည်။ ခဏစောင့်ပါ...", "info");

    const lines = scriptText.split("\n").filter(l => l.trim().length > 0);
    const audioBuffers = [];
    let hasError = false;

    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    for(let idx = 0; idx < lines.length; idx++){
        const line = lines[idx];
        let speakerName = "";
        let lineText = line;

        if(line.includes(":")){
            const parts = line.split(":");
            speakerName = parts[0].trim().toLowerCase();
            lineText = parts.slice(1).join(":").trim();
        }

        const config = speakerMap[speakerName] || { voice: "Puck", style: "normal" };
        
        let promptWithStyle = lineText;
        if(config.style && config.style !== "normal"){
            promptWithStyle = `[Tone/Style: Read this in a ${config.style} manner]\n${lineText}`;
        }

        let lineSuccess = false;
        for(let k = 0; k < API_KEYS.length; k++){
            const apiKey = API_KEYS[k];
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptWithStyle }] }],
                        generationConfig: {
                            responseMimeType: "audio/wav",
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: config.voice }
                                }
                            }
                        }
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                const candidate = data.candidates?.[0];
                const part = candidate?.content?.parts?.[0];

                if(part && part.inlineData){
                    const bytes = base64ToUint8Array(part.inlineData.data);
                    const buffer = await audioContext.decodeAudioData(bytes.buffer);
                    audioBuffers.push(buffer);
                    lineSuccess = true;
                    break;
                }
            } catch(e) {
                console.error(`Line ${idx+1} Error:`, e);
            }
        }

        if(!lineSuccess){
            hasError = true;
            showMultiGenerateMessage(`❌ လိုင်းနံပါတ် (${idx+1}) ဖန်တီးရာတွင် အမှားတစ်ခုရှိခဲ့ပါသည်။`, "error");
            break;
        }
    }

    if(!hasError && audioBuffers.length > 0){
        const mergedBuffer = mergeAudioBuffers(audioBuffers, audioContext);
        const wavBlob = audioBufferToWavBlob(mergedBuffer);
        handleAudioGenerated(wavBlob);
        showMultiGenerateMessage("✅ Multi-Voice Audio ဖန်တီးပြီးပါပြီ။", "success");
    }

    btn.disabled = false;
    btn.innerHTML = "🎭 Generate Multi-Voice Audio";
}

// Global variable for current audio blob
let currentAudioBlob = null;

function handleAudioGenerated(audioBlob) {
    currentAudioBlob = audioBlob;
    const audioUrl = URL.createObjectURL(audioBlob);
    
    const audioPlayer = document.getElementById("audioPlayer");
    const downloadBtn = document.getElementById("downloadBtn");
    
    if(audioPlayer) audioPlayer.src = audioUrl;
    if(downloadBtn) downloadBtn.style.display = "inline-block";
}

// Download Button Click Handler (WebView Safe Fix)
function triggerDownload(e) {
    if (e) e.preventDefault();
    if (!currentAudioBlob) return;

    const reader = new FileReader();
    reader.onloadend = function() {
        const base64Data = reader.result;
        const a = document.createElement('a');
        a.href = base64Data;
        a.download = "gemini-narration-voice.wav";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };
    reader.readAsDataURL(currentAudioBlob);
}

/* AUDIO MERGE & CONVERT HELPERS */
function mergeAudioBuffers(buffers, ctx){
    let totalLength = 0;
    buffers.forEach(b => totalLength += b.length);
    
    const outBuffer = ctx.createBuffer(
        buffers[0].numberOfChannels,
        totalLength,
        buffers[0].sampleRate
    );

    let offset = 0;
    buffers.forEach(b => {
        for(let channel = 0; channel < b.numberOfChannels; channel++){
            outBuffer.getChannelData(channel).set(b.getChannelData(channel), offset);
        }
        offset += b.length;
    });

    return outBuffer;
}

function audioBufferToWavBlob(buffer){
    const numOfChan = buffer.numberOfChannels;
    const length = buffer.length * numOfChan * 2 + 44;
    const out = new DataView(new ArrayBuffer(length));
    let channels = [], sampleRate = buffer.sampleRate, offset = 0, pos = 0;

    function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8);
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt "
    setUint32(16);
    setUint16(1);
    setUint16(numOfChan);
    setUint32(sampleRate);
    setUint32(sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    for(let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

    while(offset < buffer.length){
        for(let i = 0; i < numOfChan; i++){
            let sample = Math.max(-1, Math.min(1, channels[i][offset]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            out.setInt16(pos, sample, true);
            pos += 2;
        }
        offset++;
    }

    return new Blob([out.buffer], { type: "audio/wav" });
}

function base64ToUint8Array(base64){
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0; i<binary.length; i++){
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
}
</script>
