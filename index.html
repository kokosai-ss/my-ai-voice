<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Multi-Speaker Voice Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: #60a5fa;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 120px;
            font-family: inherit;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            display: block;
        }

        .message.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            display: block;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            text-align: center;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        .download-btn:hover {
            background-color: #059669;
        }

        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Gemini Multi-Speaker Voice Generator</h2>

    <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
    </div>

    <div class="row">
        <div class="col form-group">
            <label for="speaker1Select">Speaker 1 Voice (အမျိုးသမီး)</label>
            <select id="speaker1Select">
                <option value="Kore">Kore (Female)</option>
                <option value="Aoede">Aoede (Female)</option>
            </select>
        </div>
        <div class="col form-group">
            <label for="speaker2Select">Speaker 2 Voice (အမျိုးသား)</label>
            <select id="speaker2Select">
                <option value="Puck">Puck (Male)</option>
                <option value="Fenrir">Fenrir (Male)</option>
                <option value="Charon">Charon (Male)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="styleSelect">Tone/Style</label>
        <select id="styleSelect">
            <option value="Speak in a natural conversational tone.">Natural Conversation</option>
            <option value="Speak in a dramatic and expressive tone.">Dramatic</option>
            <option value="Speak cheerful and friendly.">Cheerful</option>
        </select>
    </div>

    <div class="form-group">
        <label for="textInput">Dialogue Script ([1]: Speaker 1, [2]: Speaker 2)</label>
        <textarea id="textInput" placeholder="[1]: မင်္ဂလာပါ...&#10;[2]: ဟုတ် မင်္ဂလာပါဗျာ။">[1]: မောင်... ဒီနေ့ ညစာ ဘာစားမလဲဟင်။
[2]: မင်း စားချင်တာ ပြောလေ... မောင် ဝယ်ခဲ့ပေးမယ်။
[1]: ဒါဆိုရင်တော့ ရှမ်းခေါက်ဆွဲပဲ စားချင်တယ်။</textarea>
    </div>

    <button id="generateBtn" onclick="generateVoice()">🔊 Generate Multi-Voice</button>

    <div id="generateMessage" class="message"></div>

    <div id="result" class="result-box">
        <label>Audio Preview:</label>
        <audio id="audioPlayer" controls></audio>
        
        <div class="form-group">
            <label for="speedSlider">Playback Speed</label>
            <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" onchange="updateSpeed(this.value)">
            <span id="speedValue">1.0x</span>
        </div>

        <a id="downloadBtn" class="download-btn" href="#" download="dialogue.wav">📥 Download Audio (.wav)</a>
    </div>
</div>

<script>
    let audioURL = null;

    function showGenerateMessage(msg, type) {
        const el = document.getElementById("generateMessage");
        el.innerText = msg;
        el.className = `message ${type}`;
    }

    function updateSpeed(val) {
        document.getElementById("speedValue").innerText = val + "x";
        const player = document.getElementById("audioPlayer");
        if(player) {
            player.playbackRate = parseFloat(val);
        }
    }

    function pcmToWav(pcmData, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) {
        const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
        const blockAlign = numChannels * (bitsPerSample / 8);
        const dataSize = pcmData.length;
        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);
        writeString(view, 36, 'data');
        view.setUint32(40, dataSize, true);

        const pcmArray = new Uint8Array(pcmData.buffer || pcmData);
        const wavArray = new Uint8Array(buffer, 44);
        wavArray.set(pcmArray);

        return buffer;
    }

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    function base64ToUint8Array(base64) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    }

    async function generateVoice(){
        const key = document.getElementById("apiKey").value.trim();
        const rawText = document.getElementById("textInput").value.trim();
        const style = document.getElementById("styleSelect").value;
        const spk1 = document.getElementById("speaker1Select").value;
        const spk2 = document.getElementById("speaker2Select").value;
        const btn = document.getElementById("generateBtn");

        if(!key){
            showGenerateMessage("🔑 အရင်ဆုံး Gemini API Key ထည့်ပါ။", "error");
            return;
        }

        if(!rawText){
            showGenerateMessage("📝 စကားပြော စာသားထည့်ပါ။", "error");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>Generating Dialogue...';
        document.getElementById("generateMessage").className = "message";
        document.getElementById("result").style.display = "none";

        try{
            const formattedScript = rawText
                .replace(/\[1\]\s*:/g, "Speaker 1:")
                .replace(/\[2\]\s*:/g, "Speaker 2:");

            const prompt = `${style}\n\nRead this dialogue in Burmese language:\n${formattedScript}`;

            const body = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        multiSpeakerVoiceConfig: {
                            speakerVoiceConfigs: [
                                {
                                    speaker: "Speaker 1",
                                    voiceConfig: {
                                        prebuiltVoiceConfig: { voiceName: spk1 }
                                    }
                                },
                                {
                                    speaker: "Speaker 2",
                                    voiceConfig: {
                                        prebuiltVoiceConfig: { voiceName: spk2 }
                                    }
                                }
                            ]
                        }
                    }
                }
            };

            // gemini-2.0-flash Model နာမည်အမှန်
            const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": key
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if(!response.ok){
                throw new Error(data?.error?.message || "Gemini API Error");
            }

            const base64 = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

            if(!base64){
                throw new Error("Gemini က Audio Data မပြန်လာပါ။");
            }

            const pcm = base64ToUint8Array(base64);
            const wav = pcmToWav(pcm, 24000, 1, 16);
            const blob = new Blob([wav], { type: "audio/wav" });

            if(audioURL){
                URL.revokeObjectURL(audioURL);
            }

            audioURL = URL.createObjectURL(blob);

            const player = document.getElementById("audioPlayer");
            player.src = audioURL;

            const currentSpeed = document.getElementById("speedSlider")?.value || 1.0;
            player.playbackRate = parseFloat(currentSpeed);

            const download = document.getElementById("downloadBtn");
            download.href = audioURL;
            download.download = "gemini-dialogue.wav";

            document.getElementById("result").style.display = "block";
            showGenerateMessage("✅ Multi-Voice ဖန်တီးပြီးပါပြီ။", "success");

        }catch(error){
            console.error(error);
            showGenerateMessage("❌ " + error.message, "error");
        }finally{
            btn.disabled = false;
            btn.innerHTML = "🔊 Generate Multi-Voice";
        }
    }
</script>

</body>
</html>
