<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            color: #94a3b8;
            display: block;
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ AI Voice Generator</h2>
    
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Gemini API Key ထည့်ပါ...">

    <label>အသံအမျိုးအစား ရွေးပါ (Voice Option)</label>
    <select id="voiceSelect">
        <option value="Puck">Puck (အမျိုးသားအသံ / Deep & Clear)</option>
        <option value="Charon">Charon (အမျိုးသားအသံ / Deep Tone)</option>
        <option value="Kore">Kore (အမျိုးသမီးအသံ / Smooth)</option>
        <option value="Fenrir">Fenrir (အမျိုးသားအသံ / Energetic)</option>
        <option value="Aoede">Aoede (အမျိုးသမီးအသံ / Bright)</option>
    </select>

    <label>စာသား ရိုက်ထည့်ပါ</label>
    <textarea id="textInput" rows="4" placeholder="အသံပြောင်းချင်သော စာသားများကို ရေးပါ..."></textarea>

    <button id="submitBtn" onclick="generateSpeech()">အသံထုတ်မည်</button>

    <audio id="audioPlayer" controls style="display:none;"></audio>
</div>

<script>
async function generateSpeech() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('textInput').value.trim();
    const voice = document.getElementById('voiceSelect').value;
    const audioPlayer = document.getElementById('audioPlayer');
    const submitBtn = document.getElementById('submitBtn');

    if (!apiKey || !text) {
        alert("API Key နဲ့ စာသားကို ဖြည့်ပေးပါ!");
        return;
    }

    submitBtn.innerText = "ခဏစောင့်ပါ...";
    submitBtn.disabled = true;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: text }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: {
                                voiceName: voice
                            }
                        }
                    }
                }
            })
        });

        const data = await response.json();
        
        if (data.error) {
            alert("Error: " + data.error.message);
        } else if (data.candidates && data.candidates[0].content.parts[0].inlineData) {
            const base64Audio = data.candidates[0].content.parts[0].inlineData.data;
            const mimeType = data.candidates[0].content.parts[0].inlineData.mimeType || "audio/wav";
            audioPlayer.src = `data:${mimeType};base64,${base64Audio}`;
            audioPlayer.style.display = "block";
            audioPlayer.play();
        } else {
            alert("အသံဖိုင် ထုတ်လုပ်၍ မရရှိပါ။ စာသားကို ပြန်စစ်ဆေးပေးပါ။");
        }
    } catch (err) {
        alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ: " + err.message);
    } finally {
        submitBtn.innerText = "အသံထုတ်မည်";
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
