<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Generator Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #ffffff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ AI Voice Generator</h2>
    
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Copy ကူးလာသော API Key ထည့်ပါ...">

    <label>အသံအမျိုးအစား (Voice)</label>
    <select id="voiceSelect">
        <option value="Puck">Puck (Male - Normal)</option>
        <option value="Charon">Charon (Male - Deep)</option>
        <option value="Kore">Kore (Female - Calm)</option>
        <option value="Fenrir">Fenrir (Male - Energetic)</option>
        <option value="Aoede">Aoede (Female - Bright)</option>
    </select>

    <label>စာသား ရိုက်ထည့်ပါ</label>
    <textarea id="textInput" rows="4" placeholder="အသံပြောင်းချင်သော စာသားကို ရိုက်ထည့်ပါ..."></textarea>

    <button id="submitBtn" onclick="generateSpeech()">အသံထုတ်မည်</button>

    <audio id="audioPlayer" controls style="display:none; width:100%; margin-top:15px;"></audio>
</div>

<script>
async function generateSpeech() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('textInput').value.trim();
    const voice = document.getElementById('voiceSelect').value;
    const audioPlayer = document.getElementById('audioPlayer');
    const submitBtn = document.getElementById('submitBtn');

    if (!apiKey || !text) { 
        alert("API Key နဲ့ စာသားကို ဖြည့်ပေးပါ!"); 
        return; 
    }

    submitBtn.innerText = "အသံထုတ်လုပ်နေသည်...";
    submitBtn.disabled = true;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { 
                        voiceConfig: { 
                            prebuiltVoiceConfig: { voiceName: voice } 
                        } 
                    }
                }
            })
        });

        const data = await response.json();

        if (data.error) {
            alert("API Error: " + data.error.message);
            return;
        }

        const candidate = data.candidates?.[0];
        const part = candidate?.content?.parts?.[0];

        if (part && part.inlineData && part.inlineData.data) {
            const base64Audio = part.inlineData.data;
            const mimeType = part.inlineData.mimeType || "audio/wav";
            audioPlayer.src = `data:${mimeType};base64,${base64Audio}`;
            audioPlayer.style.display = "block";
            audioPlayer.play();
        } else {
            alert("အသံဖိုင် မထွက်လာပါ၊ စာသားကို အင်္ဂလိပ်လို ပြန်စမ်းကြည့်ပါ သားကြီး။");
        }
    } catch (err) { 
        alert("ချိတ်ဆက်မှု မရပါ: " + err.message); 
    } finally { 
        submitBtn.innerText = "အသံထုတ်မည်"; 
        submitBtn.disabled = false; 
    }
}
</script>

</body>
</html>
