<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Generator</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #cbd5e1; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; border: none; }
        button:hover { background: #0369a1; }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ AI Voice Generator</h2>
    
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Gemini API Key ထည့်ပါ...">

    <label>စာသား ရိုက်ထည့်ပါ</label>
    <textarea id="textInput" rows="4" placeholder="အသံပြောင်းချင်သော စာသားများကို ရေးပါ..."></textarea>

    <button onclick="generateVoice()">အသံထုတ်မည်</button>

    <audio id="audioPlayer" controls style="display:none;"></audio>
</div>

<script>
async function generateVoice() {
    const key = document.getElementById('apiKey').value;
    const text = document.getElementById('textInput').value;
    const audioPlayer = document.getElementById('audioPlayer');

    if (!key || !text) {
        alert('API Key နှင့် စာသား ရိုက်ထည့်ပေးပါ');
        return;
    }

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }]
            })
        });

        const data = await response.json();
        if (data.error) {
            alert('Error: ' + data.error.message);
        } else {
            alert('Code စမ်းသပ်မှု အောင်မြင်ပါသည်။ API ချိတ်ဆက်ပြီးပါပြီ။');
        }
    } catch (err) {
        alert('အမှားအယွင်း ရှိနေပါသည်');
    }
}
</script>

</body>
</html>
