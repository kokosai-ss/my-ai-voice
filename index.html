<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Generator</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; margin-top: 10px; }
        textarea, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #ffffff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0369a1; }
        audio { width: 100%; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ AI Voice Generator</h2>

    <label>ဘာသာစကား / အသံ ရွေးပါ</label>
    <select id="langSelect">
        <option value="en">English (အင်္ဂလိပ်)</option>
        <option value="my">Myanmar (မြန်မာ)</option>
        <option value="th">Thai (ထိုင်း)</option>
        <option value="ja">Japanese (ဂျပန်)</option>
        <option value="ko">Korean (ကိုရီးယား)</option>
    </select>

    <label>စာသား ရိုက်ထည့်ပါ</label>
    <textarea id="textInput" rows="4" placeholder="အသံပြောင်းချင်သော စာသားကို ရိုက်ပါ..."></textarea>

    <button id="submitBtn" onclick="generateVoice()">အသံထုတ်မည်</button>

    <audio id="audioPlayer" controls></audio>
</div>

<script>
function generateVoice() {
    const text = document.getElementById('textInput').value.trim();
    const lang = document.getElementById('langSelect').value;
    const audioPlayer = document.getElementById('audioPlayer');

    if (!text) {
        alert("စာသား ရိုက်ထည့်ပါ သားကြီး!");
        return;
    }

    // Google Translate TTS Engine ကို တိုက်ရိုက် ခေါ်သုံးခြင်း
    const encodedText = encodeURIComponent(text);
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=${lang}&client=tw-ob`;

    audioPlayer.src = audioUrl;
    audioPlayer.style.display = "block";
    audioPlayer.play().catch(() => {
        // Autoplay Block ဖြစ်ရင် Player ကနေ နှိပ်ဖွင့်နိုင်အောင်
    });
}
</script>

</body>
</html>
